name: ci

on:
  pull_request:
  push:
    branches: [ develop, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  AWS_REGION: us-east-1
  ECR_REPO: 329551316753.dkr.ecr.us-east-1.amazonaws.com/jimag-dev-inventory-svc
  IMAGE_TAG: dev-${{ github.sha }}

permissions:
  contents: read
  id-token: write

jobs:
  checks:
    name: Lint / Typecheck / Unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cmd: [ "lint", "typecheck", "test" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: |
          case "${{ matrix.cmd }}" in
            lint) npm run lint --if-present ;;
            typecheck) npm run typecheck --if-present ;;
            test) npm test --if-present -- --ci ;;
          esac

  build:
    name: Build app + Docker image + Trivy scan (report)
    runs-on: ubuntu-latest
    needs: [checks]
    steps:
      - uses: actions/checkout@v4

      # App build (keeps CI honest)
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

      # Build image locally (no push here)
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy scan: report only (does NOT fail pipeline)
      - name: Trivy scan (report only)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}
          format: table
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "0"